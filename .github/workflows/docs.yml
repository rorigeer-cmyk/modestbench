name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'astro.config.js'
      - 'tsconfig.json'
      - 'scripts/copy-docs.ts'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          runtime: node@24.22.0
          cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build documentation
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
