description: Prepares the repo for a typical CI job

name: Prepare
inputs:
  node-version: # id of input
    description: 'Node.js version'
    required: false
    default: '24'

runs:
  steps:
    - name: Install pnpm and Node.js
      uses: pnpm/setup@v3.2.0
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
  using: composite
