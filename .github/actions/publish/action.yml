name: Publish
description: Publish to npm

inputs:
  token:
    description: 'npm token'
    required: true

runs:
  steps:
    # see https://github.com/google-github-actions/release-please-action#automating-publication-to-npm
    # see https://docs.npmjs.com/generating-provenance-statements
    - name: Checkout Repository
      uses: actions/checkout@v7.0.1
    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24.18.0
        registry-url: https://registry.npmjs.org
    - name: Install & Build
      uses: bahmutov/npm-install@20216767ca67f0f7b4d095dc5859c5700a6581cb
    - name: Publish to npm
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: npm publish --provenance --access public --registry https://registry.npmjs.org
      shell: bash
  using: composite
